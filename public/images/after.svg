<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" fill="none" role="img" aria-label="Cheveux forts, brillants et soyeux après le rituel VALON">
  <defs>
    <linearGradient id="af_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2010"/>
      <stop offset="1" stop-color="#0c0805"/>
    </linearGradient>
    <radialGradient id="af_glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#E4C76B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E4C76B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="560" fill="url(#af_bg)"/>
  <rect width="700" height="560" fill="url(#af_glow)"/>
  <!-- rich base strands -->
  <g stroke="#4a371f" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M110 20 C70 170 150 340 110 545"/>
    <path d="M230 20 C190 190 270 360 230 545"/>
    <path d="M350 18 C310 200 390 370 350 545"/>
    <path d="M470 20 C430 190 510 360 470 545"/>
    <path d="M590 20 C550 180 630 340 590 545"/>
  </g>
  <g stroke="#6b4f2c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M170 15 C210 180 130 350 175 545"/>
    <path d="M290 12 C330 200 250 360 295 545"/>
    <path d="M410 14 C450 200 370 360 410 545"/>
    <path d="M530 16 C570 190 490 350 530 545"/>
    <path d="M650 22 C610 170 690 330 645 545"/>
  </g>
  <!-- golden highlight strands -->
  <g stroke="#C9A227" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M230 20 C190 190 270 360 230 545"/>
    <path d="M350 18 C310 200 390 370 350 545"/>
    <path d="M470 20 C430 190 510 360 470 545"/>
    <path d="M290 12 C330 200 250 360 295 545"/>
  </g>
  <!-- bright shine highlights -->
  <g stroke="#F4E5B0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M170 15 C210 180 130 350 175 545"/>
    <path d="M410 14 C450 200 370 360 410 545"/>
    <path d="M590 20 C550 180 630 340 590 545"/>
  </g>
  <!-- soft glossy band -->
  <rect x="250" y="0" width="120" height="560" fill="#fff" opacity="0.05"/>
</svg>
