  <rect x="118" y="208" width="124" height="214" rx="8" fill="none" stroke="url(#s_goldH)" stroke-width="1.2" opacity="0.75"/>
  <text x="180" y="262" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="32" letter-spacing="5" fill="url(#s_gold)">VALON</text>
  <text x="180" y="285" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" letter-spacing="7" fill="#C9A227">HAIR CARE</text>
