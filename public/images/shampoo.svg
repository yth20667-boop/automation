  <text x="180" y="340" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" letter-spacing="0.5" fill="#ece5d6">Shampooing</text>
  <text x="180" y="358" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" letter-spacing="0.5" fill="#ece5d6">Nourrissant &amp; Fortifiant</text>
  <text x="180" y="400" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="4" fill="#bdb198">250 ML</text>
