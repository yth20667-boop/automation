<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" fill="none" role="img" aria-label="Flacon de shampooing VALON noir et or">
  <defs>
    <linearGradient id="s_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DA94"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9C7C16"/>
    </linearGradient>
    <linearGradient id="s_goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C7C16"/>
      <stop offset="0.5" stop-color="#F0DA94"/>
      <stop offset="1" stop-color="#9C7C16"/>
