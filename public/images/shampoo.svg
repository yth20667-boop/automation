      <stop offset="0.45" stop-color="#151515"/>
      <stop offset="0.78" stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <radialGradient id="s_shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="180" cy="530" rx="120" ry="20" fill="url(#s_shadow)"/>
  <!-- cap -->
  <rect x="136" y="32" width="88" height="72" rx="11" fill="url(#s_gold)"/>
  <rect x="136" y="90" width="88" height="9" rx="3" fill="#7d6210" opacity="0.7"/>
  <rect x="148" y="42" width="10" height="50" rx="5" fill="#fff" opacity="0.25"/>
  <!-- neck -->
  <rect x="150" y="99" width="60" height="22" fill="#0d0d0d"/>
  <!-- body -->
  <rect x="94" y="118" width="172" height="394" rx="28" fill="url(#s_body)" stroke="#444" stroke-width="1"/>
  <rect x="118" y="142" width="16" height="346" rx="8" fill="#ffffff" opacity="0.07"/>
