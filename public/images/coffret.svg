<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" fill="none" role="img" aria-label="Coffret VALON ouvert avec le shampooing et le sérum">
  <defs>
    <linearGradient id="c_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DA94"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9C7C16"/>
    </linearGradient>
    <linearGradient id="c_goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C7C16"/>
      <stop offset="0.5" stop-color="#F0DA94"/>
      <stop offset="1" stop-color="#9C7C16"/>
    </linearGradient>
    <linearGradient id="c_body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.2" stop-color="#3a3a3a"/>
      <stop offset="0.45" stop-color="#151515"/>
      <stop offset="0.8" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="c_lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#E7DDC9"/>
    </linearGradient>
    <linearGradient id="c_boxfront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE6D4"/>
      <stop offset="1" stop-color="#D7C9AE"/>
    </linearGradient>
    <linearGradient id="c_boxin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B99B"/>
      <stop offset="1" stop-color="#E7DDC9"/>
    </linearGradient>
    <radialGradient id="c_glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c_shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="760" height="580" fill="url(#c_glow)"/>
  <ellipse cx="380" cy="528" rx="300" ry="38" fill="url(#c_shadow)"/>

  <!-- ===== Open lid standing behind ===== -->
  <path d="M214 300 L560 300 L612 96 L266 96 Z" fill="url(#c_lid)" stroke="#cdbf9f" stroke-width="1"/>
  <!-- lid gold frame -->
  <path d="M286 270 L540 270 L582 124 L328 124 Z" fill="none" stroke="url(#c_goldH)" stroke-width="1.3" opacity="0.6"/>
  <text x="436" y="206" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="46" letter-spacing="8" fill="url(#c_gold)">VALON</text>
  <line x1="372" y1="226" x2="404" y2="226" stroke="url(#c_gold)" stroke-width="1.3"/>
  <line x1="468" y1="226" x2="500" y2="226" stroke="url(#c_gold)" stroke-width="1.3"/>
  <text x="436" y="244" text-anchor="middle" font-family="Georgia,serif" font-size="14" letter-spacing="6" fill="#B6921F">HAIR CARE</text>

  <!-- ===== Box base (open, we see inside) ===== -->
  <!-- inner back wall -->
  <path d="M214 300 L560 300 L560 332 L214 332 Z" fill="url(#c_boxin)"/>
  <!-- crinkle paper filler hint -->
  <path d="M214 322 Q260 312 306 322 T398 322 T490 322 T560 322 L560 360 L214 360 Z" fill="#F3ECDC" opacity="0.85"/>
  <!-- front face -->
  <path d="M178 348 L582 348 L560 470 L200 470 Z" fill="url(#c_boxfront)"/>
  <!-- front rim highlight -->
  <path d="M178 348 L582 348 L580 358 L180 358 Z" fill="#FBF8F1" opacity="0.7"/>

  <!-- ===== Shampoo bottle (tall, left) ===== -->
  <g>
    <ellipse cx="318" cy="476" rx="78" ry="13" fill="#000" opacity="0.35"/>
    <rect x="292" y="150" width="56" height="46" rx="9" fill="url(#c_gold)"/>
    <rect x="292" y="186" width="56" height="7" rx="3" fill="#7d6210" opacity="0.7"/>
    <rect x="302" y="156" width="7" height="34" rx="3.5" fill="#fff" opacity="0.25"/>
    <rect x="300" y="193" width="40" height="14" fill="#0d0d0d"/>
    <rect x="262" y="205" width="116" height="262" rx="20" fill="url(#c_body)" stroke="#444" stroke-width="1"/>
    <rect x="278" y="222" width="11" height="232" rx="5" fill="#fff" opacity="0.07"/>
    <rect x="278" y="262" width="84" height="150" rx="6" fill="none" stroke="url(#c_goldH)" stroke-width="1" opacity="0.7"/>
    <text x="320" y="300" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="22" letter-spacing="3" fill="url(#c_gold)">VALON</text>
    <text x="320" y="316" text-anchor="middle" font-family="Georgia,serif" font-size="7" letter-spacing="4" fill="#C9A227">HAIR CARE</text>
    <line x1="296" y1="328" x2="344" y2="328" stroke="#C9A227" stroke-width="0.6" opacity="0.5"/>
    <text x="320" y="350" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" letter-spacing="0.3" fill="#ece5d6">Shampooing</text>
    <text x="320" y="362" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7.5" letter-spacing="0.3" fill="#cfc6b2">Nourrissant &amp; Fortifiant</text>
    <text x="320" y="392" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7" letter-spacing="2.5" fill="#bdb198">250 ML</text>
  </g>

  <!-- ===== Serum bottle (shorter, right, front) ===== -->
  <g>
    <ellipse cx="468" cy="486" rx="64" ry="11" fill="#000" opacity="0.35"/>
    <rect x="444" y="232" width="44" height="17" rx="5" fill="url(#c_gold)"/>
    <rect x="482" y="235" width="26" height="10" rx="3" fill="url(#c_gold)"/>
    <rect x="458" y="248" width="15" height="20" fill="#caa227" opacity="0.55"/>
    <rect x="436" y="266" width="60" height="21" rx="6" fill="url(#c_gold)"/>
    <rect x="446" y="287" width="38" height="12" fill="#0d0d0d"/>
    <rect x="416" y="298" width="100" height="180" rx="17" fill="url(#c_body)" stroke="#444" stroke-width="1"/>
    <rect x="432" y="314" width="10" height="150" rx="5" fill="#fff" opacity="0.07"/>
    <rect x="432" y="346" width="68" height="104" rx="6" fill="none" stroke="url(#c_goldH)" stroke-width="1" opacity="0.7"/>
    <text x="466" y="378" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="18" letter-spacing="2.5" fill="url(#c_gold)">VALON</text>
    <text x="466" y="392" text-anchor="middle" font-family="Georgia,serif" font-size="6" letter-spacing="3.5" fill="#C9A227">HAIR CARE</text>
    <line x1="446" y1="402" x2="486" y2="402" stroke="#C9A227" stroke-width="0.6" opacity="0.5"/>
    <text x="466" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7.5" letter-spacing="0.3" fill="#ece5d6">Sérum Fortifiant</text>
    <text x="466" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="6.5" letter-spacing="2.5" fill="#bdb198">75 ML</text>
  </g>
</svg>
