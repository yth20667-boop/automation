<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none" role="img" aria-label="Coffret cadeau VALON fermé">
  <defs>
    <linearGradient id="b_front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F1E7"/>
      <stop offset="1" stop-color="#E2D7C2"/>
    </linearGradient>
    <linearGradient id="b_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#EFE7D6"/>
    </linearGradient>
    <linearGradient id="b_side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9CDB4"/>
      <stop offset="1" stop-color="#C7B999"/>
    </linearGradient>
    <linearGradient id="b_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4C76B"/>
      <stop offset="1" stop-color="#A8851A"/>
    </linearGradient>
    <radialGradient id="b_shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="285" cy="420" rx="220" ry="30" fill="url(#b_shadow)"/>
  <!-- side face -->
  <path d="M400 150 L470 110 L470 320 L400 360 Z" fill="url(#b_side)"/>
  <!-- top face -->
  <path d="M150 150 L400 150 L470 110 L220 110 Z" fill="url(#b_top)"/>
  <!-- front face -->
  <rect x="150" y="150" width="250" height="210" fill="url(#b_front)"/>
  <!-- gold frame on front -->
  <rect x="172" y="186" width="206" height="138" rx="2" fill="none" stroke="url(#b_gold)" stroke-width="1.4" opacity="0.55"/>
  <!-- brand front -->
  <text x="275" y="256" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="44" letter-spacing="7" fill="url(#b_gold)">VALON</text>
  <line x1="222" y1="276" x2="252" y2="276" stroke="url(#b_gold)" stroke-width="1.2"/>
  <line x1="298" y1="276" x2="328" y2="276" stroke="url(#b_gold)" stroke-width="1.2"/>
  <text x="275" y="293" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="6" fill="#A8851A">HAIR CARE</text>
  <!-- gold on top face -->
  <text x="307" y="138" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="17" letter-spacing="3" fill="#B6921F" opacity="0.85" transform="skewX(-26)">VALON</text>
</svg>
