<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" fill="none" role="img" aria-label="Flacon de sérum VALON noir et or avec pompe">
  <defs>
    <linearGradient id="se_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DA94"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9C7C16"/>
    </linearGradient>
    <linearGradient id="se_goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C7C16"/>
      <stop offset="0.5" stop-color="#F0DA94"/>
      <stop offset="1" stop-color="#9C7C16"/>
    </linearGradient>
    <linearGradient id="se_body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.2" stop-color="#363636"/>
      <stop offset="0.45" stop-color="#141414"/>
      <stop offset="0.78" stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <radialGradient id="se_shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="150" cy="540" rx="95" ry="16" fill="url(#se_shadow)"/>
  <!-- pump head -->
  <rect x="118" y="18" width="58" height="22" rx="7" fill="url(#se_gold)"/>
  <rect x="168" y="22" width="36" height="13" rx="4" fill="url(#se_gold)"/>
  <rect x="138" y="38" width="20" height="28" fill="#caa227" opacity="0.55"/>
  <!-- collar -->
  <rect x="108" y="62" width="80" height="28" rx="7" fill="url(#se_gold)"/>
  <rect x="118" y="68" width="8" height="16" rx="4" fill="#fff" opacity="0.3"/>
  <!-- neck -->
  <rect x="124" y="88" width="48" height="16" fill="#0d0d0d"/>
  <!-- body -->
  <rect x="92" y="102" width="116" height="410" rx="22" fill="url(#se_body)" stroke="#444" stroke-width="1"/>
  <rect x="112" y="124" width="13" height="360" rx="6" fill="#ffffff" opacity="0.07"/>
  <!-- label -->
  <rect x="112" y="206" width="76" height="200" rx="7" fill="none" stroke="url(#se_goldH)" stroke-width="1.1" opacity="0.75"/>
  <text x="150" y="252" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="22" letter-spacing="3" fill="url(#se_gold)">VALON</text>
  <text x="150" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" letter-spacing="4.5" fill="#C9A227">HAIR CARE</text>
  <line x1="124" y1="284" x2="176" y2="284" stroke="#C9A227" stroke-width="0.7" opacity="0.55"/>
  <text x="150" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9.5" letter-spacing="0.3" fill="#ece5d6">Sérum</text>
  <text x="150" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9.5" letter-spacing="0.3" fill="#ece5d6">Fortifiant Cheveux</text>
  <text x="150" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8.5" letter-spacing="3" fill="#bdb198">75 ML</text>
</svg>
